<!DOCTYPE html>

<html>
    <head>
        <title>Order form for community library</title>
    </head>

    <body>
        
        <form action="https://httpbin.org/post" method="post" target="_blank">
            <h2>Community Book Haven: Book Request and Loan Processing</h2>

            <h3> Borrower Identification</h3><br>

            <label for="b_name">Full Name:</label>
            <input type="text" id="b_name" name="borrower_name" placeholder="Full Name"><br><br>

            <label for="email_address">Email Address:</label>
            <input type="email" name="borrower_email" id="email_address" placeholder="Email Address"><br><br>

            <label for="library_id">library ID:</label>
            <input type="text" name="library_id" id="library_id" placeholder="library identification"><br><br>

            <h3>Resource Selection</h3>
            <label for="book"><strong>Book Title</strong></label><br>
            <label for="book_title">Enter Book Title:</label>
            <input type="text" name="book_name" id="book_title" placeholder="book name"><br><br>
            
            
            <label for="category"><strong>Select Book Category </strong></label><br>
        
            <input type="radio" name="category" id="fiction_book" value="Fiction">
            <label for="fiction_book">Fiction</label><br>

            <input type="radio" name="category" id="academic_book" value="Academic">
            <label for="academic_book">Academic</label><br>

            <input type="radio" name="category" id="children_book" value="Children's Book">
            <label for="children_book">Children's Book</label><br>

            <h3>Extra Services</h3>
            <input type="checkbox" name="extra_services" id="sms" value="sms_alert">
            <label for="sms" title="Receive a text when your book is ready for pickup">Notify via SMS</label><br>

            <input type="checkbox" name="extra_services" id="large_font" value="large_Print_version">
            <label for="large_font" title="Request a version with increased font size">Large Print Version</label><br>

            <input type="checkbox" name="extra_services" id="digital_copy" value="get_digital_copy">
            <label for="digital_copy" title="Get a digital PDF version of the book if possible">Digital Copy Included</label><br>

            <input type="checkbox" name="extra_services" id="bookmark" value="bookmark_included">
            <label for="bookmark" title="library provides a physical bookmark so you do not end up folding the pages">Have Bookmark Included</label><br>


            <input type="checkbox" name="extra_services" id="delivery" value="home_delivery">
            <label for="delivery" title="Have the book brought directly to your door">Home Delivery</label><br>

            <input type="checkbox" name="extra_services" id="audio_sync_email" value="audio_sync">
            <label for="audio_sync_email" title="Receive digital book audio link via email">Audio Sync</label><br><br>

            <button type="submit">Complete Book Request</button><br><br>
        </form>
        <a href="community_library.html" target="_blank" title="click here to go back to the community book haven page.">Click Here</a> 
    </body>
</html>
