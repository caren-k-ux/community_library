<!DOCTYPE html>

<html>
    <head>
        <title>Order form for community library</title>
        <link rel="stylesheet" href="style.css" type="text/css">
        
    </head>

    <body id="order_page">
        <div>
        <form action="https://httpbin.org/post" method="post" target="_blank" id="library_form">
            <h2>Community Book Haven: Book Request and Loan Processing</h2>

            <h3> Borrower Identification</h3><br>

            <label for="b_name">Full Name:</label><br>
            <input type="text" id="b_name" name="borrower_name" placeholder="Full Name"><br><br>

            <label for="email_address">Email Address:</label><br>
            <input type="email" name="borrower_email" id="email_address" placeholder="Email Address"><br><br>

            <label for="library_id">Library ID:</label><br>
    
            <input type="text" name="library_id" id="library_id" placeholder="library identification"><br><br>

            <h3>Resource Selection</h3>
            <label for="book"><strong>Book Title</strong></label><br>
            <label for="book_title">Enter Book Title:</label>
            <input type="text" name="book_name" id="book_title" placeholder="book name"><br><br>

            <label for="author"><strong>Book Author / Writer</strong></label><br>
            <label for="book_author">Enter the Book Author:</label>
            <input type="text" name="book_author" id="book_author" placeholder="e.g David C. Lay"><br><br>

            <label for="edition"><strong>Book Edition</strong></label><br>
            <label for="book_edition" title="Enter book edition for easy searching">Enter the Book Edition</label>
            <input type="text" name="edition" id="book_edition" placeholder="e.g 6th Edition"><br><br>

            
            
            
            <label for="category"><strong>Select Book Category </strong></label><br>
        
            <input type="radio" name="category" id="fiction_book" value="Fiction">
            <label for="fiction_book">Fiction</label><br>

            <input type="radio" name="category" id="academic_book" value="Academic">
            <label for="academic_book">Academic</label><br>

            <input type="radio" name="category" id="children_book" value="Children's Book">
            <label for="children_book">Children's Book</label><br>

            <h3>Extra Services</h3>
            <input type="checkbox" name="extra_services" id="sms" value="sms_alert">
            <label for="sms" title="Receive a text when your book is ready for pickup">Notify via SMS</label><br>

            <input type="checkbox" name="extra_services" id="large_font" value="large_Print_version">
            <label for="large_font" title="Request a version with increased font size">Large Print Version</label><br>

            <input type="checkbox" name="extra_services" id="digital_copy" value="get_digital_copy">
            <label for="digital_copy" title="Get a digital PDF version of the book if possible">Digital Copy Included</label><br>

            <input type="checkbox" name="extra_services" id="bookmark" value="bookmark_included">
            <label for="bookmark" title="library provides a physical bookmark so you do not end up folding the pages">Have Bookmark Included</label><br>


            <input type="checkbox" name="extra_services" id="delivery" value="home_delivery">
            <label for="delivery" title="Have the book brought directly to your door">Home Delivery</label><br>

            <input type="checkbox" name="extra_services" id="audio_sync_email" value="audio_sync">
            <label for="audio_sync_email" title="Receive digital book audio link via email">Audio Sync</label><br><br>

            <button type="button" onclick="addBorrowerRequestInfo()" title="click here to add your information on the table below">Add Borrower Information</button>
        </form>
        </div>
        <div id="style_table">
            <h2>Book Request Information Table</h2>
            <table  class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email Address</th>
                        <th>Library ID</th>
                        <th>Book Title</th>
                        <th>Book Author</th>
                        <th>Book Edition</th>
                        <th>Book Category</th>
                        <th>Extra Services</th>

                    </tr>
                </thead>
                <tbody id="table_data">
                </tbody>
            </table>
            <p id="message"></p>

            <script>
                function addBorrowerRequestInfo()
                {
                    let borrowerName = document.getElementById("b_name").value;
                    let emailAddress = document.getElementById("email_address").value;
                    let libraryIdentification = document.getElementById("library_id").value;
                    let bookTitle = document.getElementById("book_title").value;
                    let bookAuthor = document.getElementById("book_author").value;
                    let bookEdition = document.getElementById("book_edition").value;
                    const bookCategory = document.querySelector('input[name ="category"]:checked')?.value || "None";
                    const extraServices = document.querySelectorAll('input[name="extra_services"]:checked');
                    const serviceList = Array.from(extraServices).map(cb => cb.value).join(", ");


                    //get table
                    let table = document.getElementById("table_data");

                    //create new row
                    let newRow = table.insertRow(-1);

                    //create cells
                    let cell1 = newRow.insertCell(0);
                    let cell2 = newRow.insertCell(1);
                    let cell3 = newRow.insertCell(2);
                    let cell4 = newRow.insertCell(3);
                    let cell5 = newRow.insertCell(4);
                    let cell6 = newRow.insertCell(5);
                    let cell7 = newRow.insertCell(6);
                    let cell8 = newRow.insertCell(7);

                    //Add values to cells
                    cell1.innerHTML = borrowerName;
                    cell2.innerHTML = emailAddress;
                    cell3.innerHTML = libraryIdentification;
                    cell4.innerHTML = bookTitle;
                    cell5.innerHTML = bookAuthor;
                    cell6.innerHTML = bookEdition;
                    cell7.innerHTML = bookCategory;
                    cell8.innerHTML = serviceList || "None";

                    //display success message
                    document.getElementById("message").innerHTML = "Borrower Request Information Added Successfully!!";
                    
                    //clear form fields
                    document.getElementById("library_form").reset();
                }


            </script>

        </div>
        <div class="submit_form_container">
            <form action="https://httpbin.org/post" method="post" target="_blank">
                <button type="submit" class="final_button" title="Click here to complete your request to the library">
                    Complete Book Request & Submit
                </button>
            </form>
        </div>
        <a href="community_library.html" target="_blank" title="click here to go back to the community book haven page.">Click Here</a> 
    </body>
</html>
